    <style>
    .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 5px;
    width: max-content;
    }

    .cell {
    width: 100px;
    height: 100px;
    font-size: 2rem;
    font-weight: bold;
    cursor: pointer;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
}

    </style>
